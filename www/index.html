.pk{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px;border-radius:18px;background:var(--s2)}.pk img{width:44px;height:66px;border-radius:9px;object-fit:cover}.pk small{font-size:10.5px;color:var(--g);font-weight:800}.pk b{display:block;font-size:14px}.pk span{font-size:11.5px;color:#f5c518}

.logo{font-size:0}.logo img{height:26px;width:auto;display:block}.fat{font-size:13px;color:#c6d0ca;margin-top:2px}
